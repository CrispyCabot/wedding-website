name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # tsx strips types without checking them, so `cdk synth` alone would not
      # catch a type error in the stacks. The typecheck step above is what does.
      - run: npx cdk synth --quiet
        working-directory: infrastructure

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy infrastructure
        run: npx cdk deploy WeddingWebsite --require-approval never
        working-directory: infrastructure

      # The SPA bundle consumes no stack outputs, so unlike Poster Walls the
      # build does not have to wait on the infrastructure deploy. It is
      # sequenced after it only because publishing needs the bucket name.
      - name: Read stack outputs
        id: outputs
        run: |
          read_output() {
            aws cloudformation describe-stacks --stack-name WeddingWebsite \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          {
            echo "web_bucket=$(read_output WebBucketName)"
            echo "distribution_id=$(read_output DistributionId)"
            echo "web_url=$(read_output WebUrl)"
          } >> "$GITHUB_OUTPUT"

      - name: Build SPA
        run: npm run build --workspace @wedding/app

      - name: Publish
        run: |
          aws s3 sync app/dist "s3://${{ steps.outputs.outputs.web_bucket }}" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.outputs.outputs.distribution_id }}" \
            --paths '/*'

      - name: Summary
        run: echo "Deployed ${{ steps.outputs.outputs.web_url }}" >> "$GITHUB_STEP_SUMMARY"
