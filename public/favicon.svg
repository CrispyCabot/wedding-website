<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Two champagne flutes pivoted from their bases so their rims meet at (32,10).
    Left flute: gold (#C9A96E), rotated +12° around base (15,47).
    Right flute: rose-gold (#B87E87), rotated -12° around base (49,47).
  -->

  <!-- Left flute (gold) -->
  <g transform="rotate(12, 15, 47)">
    <!-- Crystal bowl fill -->
    <path d="M6,7 L24,7 L20,30 L10,30 Z" fill="#FBF5E0" opacity="0.55"/>
    <!-- Champagne liquid (lower bowl) -->
    <path d="M11,22 L23,22 L20,30 L10,30 Z" fill="#D4A840" opacity="0.8"/>
    <!-- Bowl outline -->
    <path d="M6,7 L24,7 L20,30 L10,30 Z" fill="none" stroke="#C9A96E" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Stem -->
    <rect x="14" y="30" width="3" height="13" rx="0.5" fill="#C9A96E"/>
    <!-- Base -->
    <rect x="8.5" y="43" width="14" height="3.5" rx="1.75" fill="#C9A96E"/>
    <!-- Bubbles rising in glass -->
    <circle cx="15" cy="26" r="1.1" fill="white" opacity="0.75"/>
    <circle cx="18" cy="20" r="0.9" fill="white" opacity="0.6"/>
    <circle cx="13" cy="17" r="0.75" fill="white" opacity="0.5"/>
    <circle cx="17" cy="13" r="0.6" fill="white" opacity="0.35"/>
    <!-- Left-edge glass highlight (reflection) -->
    <line x1="8" y1="9" x2="10.5" y2="24" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Right flute (rose-gold) -->
  <g transform="rotate(-12, 49, 47)">
    <!-- Crystal bowl fill -->
    <path d="M40,7 L58,7 L54,30 L44,30 Z" fill="#FBF0F2" opacity="0.55"/>
    <!-- Champagne liquid (lower bowl) -->
    <path d="M41,22 L57,22 L54,30 L44,30 Z" fill="#D4A840" opacity="0.8"/>
    <!-- Bowl outline -->
    <path d="M40,7 L58,7 L54,30 L44,30 Z" fill="none" stroke="#B87E87" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Stem -->
    <rect x="47" y="30" width="3" height="13" rx="0.5" fill="#B87E87"/>
    <!-- Base -->
    <rect x="41.5" y="43" width="14" height="3.5" rx="1.75" fill="#B87E87"/>
    <!-- Bubbles -->
    <circle cx="49" cy="26" r="1.1" fill="white" opacity="0.75"/>
    <circle cx="46" cy="20" r="0.9" fill="white" opacity="0.6"/>
    <circle cx="51" cy="17" r="0.75" fill="white" opacity="0.5"/>
    <circle cx="47" cy="13" r="0.6" fill="white" opacity="0.35"/>
    <!-- Right-edge glass highlight -->
    <line x1="56" y1="9" x2="53.5" y2="24" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Clink sparkle where the two rims meet at center top -->
  <g transform="translate(32, 10)">
    <!-- Glow halo -->
    <circle r="4" fill="#FFE090" opacity="0.25"/>
    <!-- Center dot -->
    <circle r="2" fill="#FFE090"/>
    <!-- Cardinal rays -->
    <line x1="0" y1="-7" x2="0" y2="-3.5" stroke="#FFE090" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="0" y1="3.5" x2="0" y2="7" stroke="#FFE090" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="-7" y1="0" x2="-3.5" y2="0" stroke="#FFE090" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="3.5" y1="0" x2="7" y2="0" stroke="#FFE090" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Diagonal rays -->
    <line x1="-4.9" y1="-4.9" x2="-2.5" y2="-2.5" stroke="#FFE090" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="2.5" y1="2.5" x2="4.9" y2="4.9" stroke="#FFE090" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="4.9" y1="-4.9" x2="2.5" y2="-2.5" stroke="#FFE090" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="-2.5" y1="2.5" x2="-4.9" y2="4.9" stroke="#FFE090" stroke-width="1.1" stroke-linecap="round"/>
  </g>
</svg>
